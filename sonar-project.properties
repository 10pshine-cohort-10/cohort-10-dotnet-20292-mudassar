# ============================================================
# SonarQube Project Configuration (C# Backend + React JS Frontend)
# ============================================================
sonar.projectKey=cohort-10-dotnet-20292-mudassar
sonar.projectName=TaskFlow - Task Management System (.NET + React)
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source and Test Directories
sonar.sources=Backend/src/TaskManager.Api,Frontend/src
sonar.tests=Backend/tests/TaskManager.Tests

# Exclusions (generated files, build outputs, third-party dependencies, migrations)
sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/Data/Migrations/**,**/*.svg,**/*.css
sonar.test.exclusions=**/bin/**,**/obj/**
sonar.coverage.exclusions=**/Data/Migrations/**,**/Program.cs,Frontend/src/main.jsx

# C# (.NET) Analysis & Code Coverage Settings
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx

# JavaScript / JSX Analysis Settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.javascript.environments=browser,es2022,node

