<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-label="Task dashboard illustration with a daily task list, weekly progress ring, team avatars and a smart suggestion" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#2f5bea" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2f5bea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="560" height="480" fill="url(#fade)"/></mask>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".22"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#030a16" flood-opacity=".45"/>
    </filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#030a16" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- background atmosphere -->
  <ellipse cx="280" cy="236" rx="270" ry="230" fill="url(#glow)"/>
  <rect width="560" height="480" fill="url(#dots)" mask="url(#gridMask)"/>

  <g font-family="Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif">

    <!-- main card: today's tasks -->
    <g filter="url(#shadow)">
      <rect x="50" y="86" width="390" height="294" rx="20" fill="#ffffff"/>
    </g>
    <text x="80" y="128" font-size="19" font-weight="800" fill="#10243e">Today</text>
    <text x="80" y="148" font-size="12" font-weight="500" fill="#5b6b82">1 of 3 tasks done</text>
    <rect x="80" y="162" width="330" height="6" rx="3" fill="#e7ecf4"/>
    <rect x="80" y="162" width="110" height="6" rx="3" fill="#1f9d74"/>

    <!-- row 1: done -->
    <circle cx="96" cy="212" r="12" fill="#1f9d74"/>
    <path d="M90.5 212.3l3.8 3.8 7-7.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="217" font-size="14.5" font-weight="600" fill="#7b8aa0" text-decoration="line-through">Draft Q4 report</text>
    <rect x="338" y="199" width="72" height="26" rx="13" fill="#e6f6ef"/>
    <text x="374" y="216.5" font-size="12" font-weight="700" fill="#157a5a" text-anchor="middle">Done</text>
    <line x1="80" y1="242" x2="410" y2="242" stroke="#e7ecf4"/>

    <!-- row 2: in progress -->
    <circle cx="96" cy="272" r="11" fill="none" stroke="#dbe4fb" stroke-width="3"/>
    <path d="M96 261a11 11 0 0 1 11 11" fill="none" stroke="#2f5bea" stroke-width="3" stroke-linecap="round"/>
    <text x="122" y="277" font-size="14.5" font-weight="700" fill="#10243e">Review design handoff</text>
    <rect x="338" y="259" width="72" height="26" rx="13" fill="#fdf1db"/>
    <text x="374" y="276.5" font-size="12" font-weight="700" fill="#9a5b00" text-anchor="middle">High</text>
    <line x1="80" y1="302" x2="410" y2="302" stroke="#e7ecf4"/>

    <!-- row 3: pending -->
    <circle cx="96" cy="332" r="11" fill="none" stroke="#c9d3e3" stroke-width="2.4"/>
    <text x="122" y="337" font-size="14.5" font-weight="700" fill="#10243e">Send invoices</text>
    <rect x="338" y="319" width="72" height="26" rx="13" fill="#eceff5"/>
    <text x="374" y="336.5" font-size="12" font-weight="700" fill="#44546a" text-anchor="middle">Due Fri</text>

    <!-- progress ring card -->
    <g filter="url(#shadowSm)">
      <rect x="352" y="36" width="168" height="146" rx="18" fill="#ffffff"/>
    </g>
    <circle cx="436" cy="100" r="31" fill="none" stroke="#e7ecf4" stroke-width="9"/>
    <circle cx="436" cy="100" r="31" fill="none" stroke="#2f5bea" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="140.2 194.8" transform="rotate(-90 436 100)"/>
    <text x="436" y="106" font-size="17" font-weight="800" fill="#10243e" text-anchor="middle">72%</text>
    <text x="436" y="156" font-size="12.5" font-weight="700" fill="#10243e" text-anchor="middle">Weekly progress</text>
    <text x="436" y="172" font-size="11" font-weight="500" fill="#5b6b82" text-anchor="middle">18 of 25 tasks done</text>

    <!-- team card -->
    <g filter="url(#shadowSm)">
      <rect x="22" y="352" width="208" height="76" rx="16" fill="#ffffff"/>
    </g>
    <g stroke="#fff" stroke-width="3">
      <circle cx="56" cy="390" r="15" fill="#2f5bea"/>
      <circle cx="78" cy="390" r="15" fill="#1f9d74"/>
      <circle cx="100" cy="390" r="15" fill="#e5a13a"/>
      <circle cx="122" cy="390" r="15" fill="#7c5cf0"/>
    </g>
    <g font-size="11" font-weight="800" fill="#fff" text-anchor="middle">
      <text x="56" y="394">J</text><text x="78" y="394">A</text><text x="100" y="394">M</text><text x="122" y="394">S</text>
    </g>
    <text x="150" y="388" font-size="13" font-weight="800" fill="#10243e">Design team</text>
    <text x="150" y="405" font-size="11" font-weight="500" fill="#5b6b82">4 members</text>
    <circle cx="140" cy="372" r="0" fill="none"/>

    <!-- smart suggestion -->
    <g filter="url(#shadowSm)">
      <rect x="270" y="396" width="268" height="62" rx="16" fill="#eef2ff"/>
    </g>
    <rect x="270" y="396" width="268" height="62" rx="16" fill="none" stroke="#c9d6ff"/>
    <circle cx="298" cy="427" r="14" fill="#2f5bea"/>
    <path d="M298 419l1.9 5.3 5.3 1.9-5.3 1.9-1.9 5.3-1.9-5.3-5.3-1.9 5.3-1.9z" fill="#fff"/>
    <text x="324" y="422" font-size="12.5" font-weight="700" fill="#2b44a8">Suggested next</text>
    <text x="324" y="440" font-size="12" font-weight="500" fill="#2b44a8">Start “Send invoices” today.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
