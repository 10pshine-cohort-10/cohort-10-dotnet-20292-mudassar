name: SonarQube Code Quality Analysis

on:
  push:
    branches:
      - main
      - feature/sonarqube-integration
      - SonarQube-Integration
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: Analyze C# (.NET) & JavaScript (React)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Build & Test C# Backend (offline quality gate always runs)
        run: |
          dotnet build Backend/TaskManager.sln -c Release
          export Jwt__Key="ci-$(openssl rand -hex 24)"
          export SeedAdmin__Email="admin@ci.taskmanager.local"
          export SeedAdmin__Password="CiAdmin!$(openssl rand -hex 8)9"
          export SeedUser__Email="user@ci.taskmanager.local"
          export SeedUser__Password="CiUser!$(openssl rand -hex 8)9"
          dotnet test Backend/TaskManager.sln -c Release --no-build --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Lint & Build React Frontend
        working-directory: Frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Run SonarQube Scanner (when SONAR_TOKEN is configured)
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        run: |
          dotnet sonarscanner begin \
            /k:"cohort-10-dotnet-20292-mudassar" \
            /n:"TaskFlow - Task Management System (.NET + React)" \
            /v:"1.0.0" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.sourceEncoding="UTF-8" \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/Data/Migrations/**,**/*.svg,**/*.css" \
            /d:sonar.test.exclusions="**/bin/**,**/obj/**" \
            /d:sonar.coverage.exclusions="**/Data/Migrations/**,**/Program.cs,Frontend/src/main.jsx" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/**/*.trx" \
            /d:sonar.javascript.file.suffixes=".js,.jsx" \
            /d:sonar.javascript.environments="browser,es2022,node"
          dotnet build Backend/TaskManager.sln -c Release --no-incremental
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

